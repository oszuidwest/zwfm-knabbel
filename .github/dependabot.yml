version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    ignore:
      # Re-enable after svelte-check and typescript-eslint support TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Upgrade together after migrating the app to SvelteKit 3.
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/adapter-cloudflare'
        update-types: ['version-update:semver-major']
    groups:
      all-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
